- rule: PenguinBox container exec
  desc: Record every process execution inside a PenguinBox payload container.
  condition: evt.type in (execve, execveat) and container.id != host
  output: "exec container_id=%container.id container_name=%container.name pid=%proc.pid ppid=%proc.ppid proc=%proc.name exe=%proc.exepath cmd=%proc.cmdline parent=%proc.pname user=%user.name"
  priority: INFORMATIONAL
  tags: [penguinbox, process]

- rule: PenguinBox shell in container
  desc: A shell was spawned inside a PenguinBox payload container.
  condition: evt.type in (execve, execveat) and container.id != host and proc.name in (bash, sh, dash, zsh, ksh)
  output: "shell container_id=%container.id pid=%proc.pid proc=%proc.name cmd=%proc.cmdline parent=%proc.pname"
  priority: NOTICE
  tags: [penguinbox, process, shell]

- rule: PenguinBox exec from writable path
  desc: A process was executed from a writable path inside a PenguinBox payload container.
  condition: evt.type in (execve, execveat) and container.id != host and (proc.exepath startswith /tmp or proc.exepath startswith /var/tmp or proc.exepath startswith /dev/shm or proc.exepath startswith /home)
  output: "writable exec container_id=%container.id pid=%proc.pid proc=%proc.name exe=%proc.exepath cmd=%proc.cmdline"
  priority: WARNING
  tags: [penguinbox, process, execution]

- rule: PenguinBox memfd create
  desc: A PenguinBox payload created an anonymous memfd.
  condition: evt.type=memfd_create and container.id != host
  output: "memfd container_id=%container.id pid=%proc.pid proc=%proc.name"
  priority: WARNING
  tags: [penguinbox, memory, evasion]

- rule: PenguinBox ptrace
  desc: A PenguinBox payload used ptrace.
  condition: evt.type=ptrace and container.id != host
  output: "ptrace container_id=%container.id pid=%proc.pid proc=%proc.name"
  priority: WARNING
  tags: [penguinbox, process, injection]

- rule: PenguinBox proc maps read
  desc: A PenguinBox payload read a process memory map.
  condition: evt.type in (open, openat, openat2) and container.id != host and fd.name contains "/proc/" and fd.name endswith "/maps"
  output: "maps container_id=%container.id pid=%proc.pid proc=%proc.name file=%fd.name"
  priority: NOTICE
  tags: [penguinbox, discovery, memory]

- rule: PenguinBox network connect
  desc: A PenguinBox payload opened an outbound connection.
  condition: evt.type=connect and container.id != host
  output: "connect container_id=%container.id pid=%proc.pid proc=%proc.name fd=%fd.name"
  priority: INFORMATIONAL
  tags: [penguinbox, network]

- rule: PenguinBox kernel module load
  desc: A PenguinBox payload loaded a kernel module.
  condition: evt.type in (init_module, finit_module) and container.id != host
  output: "module container_id=%container.id pid=%proc.pid proc=%proc.name op=%evt.type"
  priority: CRITICAL
  tags: [penguinbox, kernel]

- rule: PenguinBox namespace change
  desc: A PenguinBox payload changed its namespace or mount view.
  condition: evt.type in (setns, unshare, mount) and container.id != host
  output: "namespace container_id=%container.id pid=%proc.pid proc=%proc.name op=%evt.type"
  priority: WARNING
  tags: [penguinbox, container, escape]
